name: tabletennis_scoreboard
description: >
  Phase 1 of the table tennis scoreboard app — a courtside scoring utility
  for real physical matches (singles). Core scoring engine + basic UI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/en/
