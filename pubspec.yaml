name: tabletennis_scoreboard
description: >
  Courtside table tennis scoreboard for real physical matches — singles
  and doubles, voice announcements, English/German/French. Published on
  Google Play as com.kozmokramer.tabletennisscoreboard.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/en/
    - assets/audio/coin_flip.wav
  # Bundled, not fetched: the app works offline. Barlow carries all UI
  # text in two weights; Barlow Condensed Black is for the score digits
  # only. Both are SIL OFL 1.1 — see assets/fonts/OFL.txt.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900

# Phase 4K app icon: a rounded-square-look icon split diagonally into
# near-black (#0B0F14) and orange (#FF8A34), a white ball (#F5F7FA)
# crossing the divide, and a subtle motion trail — see
# PHASE4K_AUDIO_MENU_AND_ICON.md. `image_path` (full design, no manual
# corner rounding — iOS and legacy Android both apply their own mask, so
# baking one in here would double-round) covers iOS and legacy Android;
# the adaptive_icon_* pair covers Android 8+'s foreground/background
# layers, generated by the same design split into a background-only
# image (the diagonal, full bleed) and a foreground-only image (the
# ball + trail, transparent elsewhere, kept inside Android's adaptive
# safe zone so it isn't clipped by circle/squircle/rounded-square
# launcher masks).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # The App Store rejects icons with an alpha channel; this icon's own
  # background is fully opaque everywhere already, so stripping alpha
  # only affects file encoding, not how it looks.
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
